[tool.poetry]
name = "nova-enterprises"
version = "0.1.0"
description = "NovaCore platform skeleton for trading, dropshipping, and social automation."
authors = ["Nova Enterprises AI Team <engineering@nova.enterprises>"]
readme = "README.md"
packages = [{ include = "nova_core" }]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.110.0"
uvicorn = { extras = ["standard"], version = "^0.29.0" }
sqlmodel = "^0.0.16"
pydantic-settings = "^2.2.1"
httpx = "^0.27.0"
prometheus-client = "^0.19.0"
opentelemetry-api = "^1.24.0"
opentelemetry-sdk = "^1.24.0"
opentelemetry-exporter-otlp = "^1.24.0"
python-dotenv = "^1.0.1"
types-requests = "^2.31.0.20240218"

[tool.poetry.group.dev.dependencies]
pytest = "^8.1.1"
pytest-asyncio = "^0.23.5"
pytest-cov = "^4.1.0"
ruff = "^0.3.5"
mypy = "^1.8.0"
types-setuptools = "^69.1.0.20240217"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
show_error_codes = true

[build-system]
requires = ["poetry-core>=1.5.0"]
build-backend = "poetry.core.masonry.api"
